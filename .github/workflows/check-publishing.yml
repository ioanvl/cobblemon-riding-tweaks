name: Check publishing tools

on:
  pull_request:
    paths:
      - '.github/workflows/*publishing*'
      - '.github/workflows/publish.yml'
      - 'scripts/release_publish.py'
      - 'tests/publishing/**'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/*publishing*'
      - '.github/workflows/publish.yml'
      - 'scripts/release_publish.py'
      - 'tests/publishing/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/publishing -v
