plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

sourceSets.test {
    java.srcDir rootProject.file('tests/mixin/java')
    resources.srcDir rootProject.file('tests/mixin/resources')
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

tasks.register('ridingMixinTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.cobblemonridingtweaks.test.RidingMixinTest'
    args 'CLIENT'
    workingDir layout.buildDirectory.dir('riding-mixin-test/client')
    doFirst { workingDir.mkdirs() }
}

// Mixin's side/configuration is process-global; exercise servers in a fresh JVM.
tasks.register('ridingServerMixinTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.cobblemonridingtweaks.test.RidingMixinTest'
    args 'SERVER'
    workingDir layout.buildDirectory.dir('riding-mixin-test/server')
    doFirst { workingDir.mkdirs() }
}

tasks.named('check') {
    dependsOn ridingMixinTest, ridingServerMixinTest
}
